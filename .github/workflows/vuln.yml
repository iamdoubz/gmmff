name: Vuln Scan

on:
  pull_request:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod # honors the toolchain directive (go1.26.5)
          cache: true

      - name: govulncheck (native + Wasm)
        run: make vuln
